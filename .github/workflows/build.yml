name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write   # needed only to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python (for font tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Doto font (SIL OFL 1.1), slimmed down
        continue-on-error: true   # if this fails, the app falls back to monospace
        run: |
          set -e
          pip install fonttools
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o /tmp/doto.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/doto/Doto%5BROND,wght%5D.ttf"
          curl -fsSL -o app/src/main/assets/fonts/OFL.txt "https://raw.githubusercontent.com/google/fonts/main/ofl/doto/OFL.txt"
          fonttools varLib.instancer /tmp/doto.ttf wght=800 ROND=100 -o /tmp/doto-i.ttf -q
          pyftsubset /tmp/doto-i.ttf --unicodes="U+0020-007E,U+00A0-00FF" --output-file=app/src/main/assets/fonts/doto.ttf
          ls -l app/src/main/assets/fonts

      - name: Set up Gradle (no wrapper needed)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Decode signing key (skipped if secrets are missing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "No signing secrets: APK will be signed with the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            NAME="omniboard-${{ github.event.release.tag_name }}.apk"
          else
            NAME="omniboard-${GITHUB_SHA::7}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniboard-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
            app/build/outputs/mapping/release/mapping.txt

      - name: Attach APK to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK_NAME" "$APK_NAME.sha256" --clobber
